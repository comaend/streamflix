# STREAMFLIX nginx – läuft ohne Root-Rechte im Container (Port 8080)
worker_processes 2;
pid /tmp/nginx.pid;
error_log stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    server_tokens off;
    client_max_body_size 10m;

    client_body_temp_path /tmp/nx_body;
    proxy_temp_path       /tmp/nx_proxy;
    fastcgi_temp_path     /tmp/nx_fcgi;
    uwsgi_temp_path       /tmp/nx_uwsgi;
    scgi_temp_path        /tmp/nx_scgi;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080 default_server;
        root /app/public;
        index index.php;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'" always;

        # Versteckte Dateien und interne Verzeichnisse niemals ausliefern
        location ~ /\. { deny all; }
        location ~* \.(sql|db|sqlite|log|ini|conf)$ { deny all; }

        # Lokal gespeicherte Poster/Hintergründe/Profilbilder (nur Bilddateien)
        location ~* ^/img/([A-Za-z0-9_.-]+\.(?:jpg|jpeg|png|webp))$ {
            alias /data/images/$1;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Content-Type-Options nosniff always;
        }
        location /img/ { return 404; }

        # Nur intern: PHP prüft Berechtigung und leitet per X-Accel-Redirect weiter.
        # Medien sind schreibgeschützt gemountet; Range-Requests übernimmt nginx.
        location /_media/ { internal; alias /media/; }
        location /_hls/   { internal; alias /data/cache/hls/; }

        location /assets/ { expires 1h; add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }

        location /api/ { rewrite ^ /api.php last; }
        location = /stream.php { include /etc/nginx/fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root/stream.php; fastcgi_pass unix:/tmp/php-fpm.sock; fastcgi_read_timeout 120; }
        location = /api.php    { include /etc/nginx/fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root/api.php;    fastcgi_pass unix:/tmp/php-fpm.sock; fastcgi_read_timeout 120; }

        location = /admin  { return 301 /admin/; }
        location = /admin/ { include /etc/nginx/fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root/admin/index.php; fastcgi_pass unix:/tmp/php-fpm.sock; }
        location /admin/   { try_files $uri =404; }

        location = /      { include /etc/nginx/fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root/index.php; fastcgi_pass unix:/tmp/php-fpm.sock; }
        location /        { try_files $uri /index.php; }
        location = /index.php { include /etc/nginx/fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root/index.php; fastcgi_pass unix:/tmp/php-fpm.sock; }
    }
}
