version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: sflix-streamflix_web_1
      APP_PORT: 8080
      # STREAMFLIX hat eigene Benutzerkonten. Ohne diese Zeile würde Umbrel
      # jeden Zugriff zusätzlich mit dem Umbrel-Passwort schützen.
      PROXY_AUTH_ADD: "false"

  web:
    # Das Image wird von Umbrel direkt aus dem mitgelieferten Dockerfile gebaut.
    build: .
    restart: unless-stopped
    stop_grace_period: 1m
    volumes:
      # Persistente Daten (Datenbank, Bilder, Backups, Cache)
      - ${APP_DATA_DIR}/data:/data
      # Umbrel-Speicher, schreibgeschützt. Darunter liegen Downloads und Co.
      - ${UMBREL_ROOT}/data/storage:/media:ro
    environment:
      TZ: UTC
      SF_MEDIA: /media
      SF_DATA: /data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
