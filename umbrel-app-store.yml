# Umbrel Community App Store manifest.
#
# `id` ist das eindeutige Prefix für jede App in diesem Store. Die ID jeder
# eigenen App MUSS mit diesem Prefix beginnen – z. B. lebt die StreamFlix-App
# im Ordner `streamflix-streamflix/` und ihre umbrel-app.yml deklariert
# `id: streamflix-streamflix`.
#
# `name` ist der Anzeigename des Stores innerhalb der umbrelOS-Oberfläche.
#
# Nutzer fügen diesen Store hinzu über: umbrelOS -> App Store ->
# "Community App Stores" -> GitHub-Repository-URL einfügen.
id: streamflix
name: "StreamFlix Store"
