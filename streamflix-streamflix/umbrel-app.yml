id: streamflix-streamflix
category: media
name: StreamFlix
version: "1.0.0"
tagline: Selbst gehostete Streaming-Plattform für lokale Filme und Serien
icon: https://raw.githubusercontent.com/comaend/streamflix/main/streamflix-streamflix/icon.png
description: |-
  StreamFlix ist eine vollständige, selbst gehostete Streaming-Plattform im Stil von Netflix für UmbrelOS und den Raspberry Pi (ARM64). Sie streamt lokale Filme und Serien aus eigenen Medienordnern, unterstützt mehrere Benutzer und Profile, persönliche Watchlisten, Wiedergabefortschritte, Untertitel, Audiospuren und ein vollstuendiges Admin-Control-Center.

  Keine kostenpflichtigen Dienste, keine externen APIs, keine Node.js. Installation direkt ueber den Umbrel Community App Store.
