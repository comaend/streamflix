# StreamFlix — Nginx-Konfiguration (läuft als UID 1000, daher Logs nach /dev/stderr/stdout)
http {
    # Logs nach stdout/stderr umleiten (Container kann nicht in /var/log/nginx schreiben)
    error_log /dev/stderr warn;
    access_log /dev/stdout;

    # PID-Datei in beschreibbarem Verzeichnis
    pid /tmp/nginx.pid;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 8080;
        root /var/www/html/app;
        index index.php;

        charset utf-8;

        # Öffentliche Dateien direkt ausliefern
        location / {
            try_files $uri $uri/ =404;
        }

        # PHP-Dateien an PHP-FPM übergeben
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # Statische Assets
        location /assets/ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Sensible Verzeichnisse vor direktem Zugriff schützen
        location ~ ^/(includes|config|templates|database|scripts)/ {
            deny all;
        }

        # Datenbank-Datei schützen
        location ~* \.(sqlite|sqlite3|db)$ {
            deny all;
        }
    }
}
