# StreamFlix — Nginx-Konfiguration
server {
    listen 8080;
    root /var/www/html/app;
    index index.php;

    charset utf-8;

    # Öffentliche Dateien direkt ausliefern
    location / {
        try_files $uri $uri/ =404;
    }

    # PHP-Dateien an PHP-FPM übergeben
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Statische Assets
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Sensible Verzeichnisse vor direktem Zugriff schützen
    location ~ ^/(includes|config|templates|database|scripts)/ {
        deny all;
    }

    # Datenbank-Datei schützen
    location ~* \.(sqlite|sqlite3|db)$ {
        deny all;
    }
}
